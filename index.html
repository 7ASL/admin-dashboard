<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <div id="sidebar" class="row3">
            <a href="/" id="logo">
                <img src="img/dashboard-panel.svg" alt="Dashboard Icon">
                <span>Dashboard</span>
            </a>
            <a href="/" id="home" class="nav-item">
                <img src="img/house-chimney.svg" alt="House Icon">
                <span>Home</span>
            </a>
            <a href="/" id="profile" class="nav-item">
                <img src="img/user.svg" alt="Person Icon">
                <span>Profile</span>
            </a>
            <a href="/" id="messages" class="nav-item">
                <img src="img/comment-alt-middle.svg" alt="Message Icon">
                <span>Messages</span>
            </a>
            <a href="/" id="history" class="nav-item">
                <img src="img/clock-five.svg" alt="Clock Icon">
                <span>Profile</span>
            </a>
            <a href="/" id="tasks" class="nav-item">
                <img src="img/checkbox.svg" alt="Checkmark Icon">
                <span>Tasks</span>
            </a>
            <a href="/" id="communities" class="nav-item">
                <img src="img/users.svg" alt="Two People Icon">
                <span>Communities</span>
            </a>
            <div id="split"></div>
            <a href="/" id="settings" class="nav-item">
                <img src="img/settings-sliders.svg" alt="Settings Icon">
                <span>Settings</span>
            </a>
            <a href="/" id="support" class="nav-item">
                <img src="img/interrogation.svg" alt="Question Mark Icon">
                <span>Support</span>
            </a>
            <a href="/" id="privacy" class="nav-item">
                <img src="img/shield.svg" alt="Shield Icon">
                <span>Privacy</span>
            </a>
            
        </div>
        <div id="navbar" class="col2">
            <span>Future Navbar Content</span>
        </div>
        <div id="header" class="col2">
            <div id="welcome">
                <h2>Hello Morgan</h2>
            </div>
            <div id="action-buttons">
                <span>Action Buttons</span>
            </div>
        </div>
        <div id="projects">
            <span>Place for current and furute projects statuses</span>
        </div>
        <div id="important">
            <div id="announcements">
                <span>Announcements</span>
            </div>
            <div id="trending">
                <span>Trending this week</span>
            </div>
        </div>
    </div>
</body>
</html>

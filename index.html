<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <div id="sidebar" class="row3">
             <span>Future Sidebar Content</span>
        </div>
        <div id="navbar" class="col2">
            <span>Future Navbar Content</span>
        </div>
        <div id="header" class="col2">
            <div id="welcome">
                <h2>Hello Morgan</h2>
            </div>
            <div id="action-buttons">
                <span>Action Buttons</span>
            </div>
        </div>
        <div id="projects">
            <span>Place for current and furute projects statuses</span>
        </div>
        <div id="important" class="row2">
            <div id="announcements">
                <span>Announcements</span>
            </div>
            <div id="trending">
                <span>Trending this week</span>
            </div>
        </div>
    </div>
</body>
</html>
